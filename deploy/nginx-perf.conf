# Konfigurasi performa nginx untuk anaslabs.my.id
#
# Nginx di VPS berjalan di host dan mem-proxy ke container `app` di port 3000.
# File ini BUKAN konfigurasi lengkap: gabungkan blok-blok di bawah ke dalam
# `server { ... }` yang sudah ada (yang memegang `server_name anaslabs.my.id`
# dan sertifikat TLS). Jangan menggandakan directive yang sudah ada.
#
# Setelah diubah:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verifikasi dari mesin lain:
#   curl -sSI https://anaslabs.my.id/assets/<nama-file>.css | grep -i cache-control
#     -> Cache-Control: public, max-age=31536000, immutable
#   curl -sSI -H 'Accept-Encoding: gzip' https://anaslabs.my.id/ | grep -i content-encoding
#     -> Content-Encoding: gzip

# ── Kompresi ─────────────────────────────────────────────────────────────────
# `vite preview` sudah mengompresi; `gzip_proxied` memastikan nginx tetap
# mengompresi respons yang datang dari upstream (default-nya `off`).
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
	text/plain
	text/css
	text/javascript
	application/javascript
	application/json
	application/manifest+json
	application/xml
	image/svg+xml;

# Kalau modul brotli tersedia, ini lebih hemat untuk JS/CSS:
# brotli on;
# brotli_comp_level 5;
# brotli_types text/css text/javascript application/javascript application/json image/svg+xml;

# ── Aset ber-hash: cache selamanya ───────────────────────────────────────────
# Nama file di /assets/ mengandung content hash dan tidak pernah berubah untuk
# isi yang sama, jadi tidak perlu revalidasi. Header dari upstream (`no-cache`
# milik `vite preview`) dibuang lalu diganti.
location /assets/ {
	proxy_pass http://127.0.0.1:3000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;

	proxy_hide_header Cache-Control;
	add_header Cache-Control "public, max-age=31536000, immutable" always;

	access_log off;
}

# ── Sisanya: HTML/SSR ────────────────────────────────────────────────────────
# HTML tidak boleh di-cache: build baru menghasilkan hash aset yang berbeda.
location / {
	proxy_pass http://127.0.0.1:3000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# Endpoint worker blast dipanggil tiap 30 detik oleh container `worker`.
	proxy_read_timeout 60s;

	proxy_hide_header Cache-Control;
	add_header Cache-Control "no-cache" always;
}

# ── Opsional: HTTP/2 ─────────────────────────────────────────────────────────
# Nginx >= 1.25.1:  http2 on;
# Versi lebih lama: `listen 443 ssl http2;` (bukan dua directive terpisah).
