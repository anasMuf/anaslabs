name: Deploy

on:
  push:
    branches: [main]

# Two pushes in quick succession used to start two deploys at once. Both ran
# `docker compose up --force-recreate` on the same VPS, so one left a temporary
# `<id>_anaslabs` container behind and the other failed with a name conflict
# (and `:latest` could be overwritten by the older build). Queue them instead.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_LOWER=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_LOWER }}:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ANASLABS_VPS
    permissions:
      contents: read
      packages: read

    steps:
      # The compose file on the VPS is not part of the image, so it drifts unless
      # we ship it. Without this, changes like `env_file: .env` never reach the
      # server and the app silently runs without its secrets.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml
          target: anaslabs
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            IMAGE=$(echo "ghcr.io/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Fail loudly: without `set -e` a failed pull used to be followed by a
            # "successful" recreate of the *old* image, so the site silently ran
            # stale code (an added route simply never appeared).
            docker pull ${IMAGE}:latest
            docker image inspect ${IMAGE}:latest --format 'image digest: {{index .RepoDigests 0}}'

            cd ~/anaslabs

            # An interrupted/overlapping recreate leaves a container named
            # `<id>_anaslabs`, which makes the next `up` fail with a name
            # conflict. Remove those stale duplicates only; keep the live one so
            # the recreate itself stays near zero-downtime.
            for stale in $(docker ps -a --format '{{.Names}}' | grep '_anaslabs$' || true); do
              echo "menghapus container sisa: ${stale}"
              docker rm -f "${stale}"
            done

            IMAGE=${IMAGE} docker compose up -d --force-recreate --remove-orphans

            # Prove the container is the image we just pulled and that it answers.
            docker compose ps
            ready=0
            for attempt in 1 2 3 4 5; do
              if curl -fsS http://localhost:3000/api/health; then
                echo ""
                ready=1
                break
              fi
              echo "health belum siap (percobaan $attempt)"
              sleep 3
            done

            if [ "$ready" -ne 1 ]; then
              echo "health check gagal; log container terakhir:"
              docker compose logs --tail=100
              exit 1
            fi

            # Pernah terjadi: container berjalan dan health check hijau, tapi
            # bundle server menunjuk stylesheet yang tidak ada di dist/client
            # (server dan client dari build berbeda), sehingga seluruh situs
            # tampil tanpa CSS. Periksa semua aset yang dirujuk HTML.
            for page in / /dashboard/login; do
              html=$(curl -fsSL "http://localhost:3000${page}")
              assets=$(printf '%s' "${html}" | grep -o '/assets/[A-Za-z0-9._/-]*\.\(css\|js\)' | sort -u || true)
              if [ -z "${assets}" ]; then
                echo "tidak menemukan aset di HTML ${page}"
                exit 1
              fi
              for asset in ${assets}; do
                if ! curl -fsS -o /dev/null "http://localhost:3000${asset}"; then
                  echo "aset dirujuk HTML tapi tidak tersedia: ${page} -> ${asset}"
                  exit 1
                fi
              done
            done
            echo "semua aset yang dirujuk HTML tersedia"

            docker image prune -f
